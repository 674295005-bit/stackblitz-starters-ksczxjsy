<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Login & Gemini AI Chatbot</title>
  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #1a73e8; text-align: center; }
    #chat-section { display: none; margin-top: 20px; }
    #chat-box { height: 300px; border: 1px solid #e0e0e0; padding: 12px; overflow-y: auto; background: #fafafa; border-radius: 8px; margin-bottom: 12px; }
    .input-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { padding: 10px 18px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #1557b0; }
    .user-msg { text-align: right; color: #1557b0; margin: 8px 0; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; width: fit-content; margin-left: auto; }
    .bot-msg { text-align: left; color: #202124; margin: 8px 0; background: #e6f4ea; padding: 8px 12px; border-radius: 8px; width: fit-content; }
    #login-section { text-align: center; margin: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
  </style>
</head>
<body>

  <h2>Google Login & Gemini AI Chatbot</h2>

  <!-- ส่วนที่ 1: ปุ่ม Google Login -->
  <div id="login-section">
    <p>กรุณาล็อกอินด้วย Google เพื่อเริ่มใช้งาน Chatbot</p>
    <div id="g_id_onload"
    data-client_id="YOUR_GOOGLE_CLIENT_ID"
    data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large"></div>
  </div>

  <!-- ส่วนที่ 2: หน้าแชต Gemini AI -->
  <div id="chat-section">
    <p>สวัสดีครับคุณ <b id="user-name"></b> 👋</p>
    <div id="chat-box"></div>
    <div class="input-group">
      <input type="text" id="user-input" placeholder="พิมพ์ข้อความถาม Gemini...">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
  </div>

  <script>
    function parseJwt (token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('chat-section').style.display = 'block';
      document.getElementById('user-name').innerText = responsePayload.name || 'User';
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const message = input.value.trim();

      if (!message) return;

      chatBox.innerHTML += <div class="user-msg"><b>คุณ:</b> ${message}</div>;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      chatBox.innerHTML += <div class="bot-msg"><b>Gemini:</b> ได้รับข้อความ "${message}" แล้วครับ (ระบบเชื่อมต่อสำเร็จ)</div>;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
